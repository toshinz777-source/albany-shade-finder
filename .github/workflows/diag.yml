name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python diag.py || true
      - run: |
          git config user.name bot; git config user.email bot@example.com
          git pull -q || true
          git add diag2.txt shot.png; git commit -m diag2; git push
